<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Happy Birthday • Trọng Renny</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg1:#ff00cc; --bg2:#333399; --bg3:#00f5d4; --bg4:#ffd166;
      --glass: rgba(255,255,255,.15);
      --white: #fff; --black:#0b1020;
      --neon: #00e5ff; --neon2:#ff6ec7; --gold:#ffd166;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; overflow:hidden; color:var(--white);
      font-family:Poppins,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      background: radial-gradient(1200px 1200px at 10% -10%, var(--bg1), transparent 60%),
                  radial-gradient(1200px 1200px at 110% 10%, var(--bg2), transparent 60%),
                  radial-gradient(1200px 1200px at 50% 120%, var(--bg3), transparent 60%),
                  radial-gradient(1200px 1200px at -10% 110%, var(--bg4), transparent 60%),
                  #12081f;
      animation: hue 20s linear infinite;
      cursor: url('images/cur/body.cur'), auto;
    }
    @keyframes hue {from{filter:hue-rotate(0)} to{filter:hue-rotate(360deg)}}

    /* Floating bubbles for extra sparkle */
    .bubbles{position:fixed; inset:0; pointer-events:none; z-index:1}
    .bubble{position:absolute; bottom:-10vh; width:12px; height:12px; border-radius:50%; opacity:.6; filter:blur(0.5px);
      background: radial-gradient(circle at 30% 30%, #fff, rgba(255,255,255,.1) 60%, transparent 70%);
      animation: floatUp linear forwards;}
    @keyframes floatUp {to{transform:translateY(-120vh) scale(1.2); opacity:.1}}

    /* Fireworks Canvas */
    #fw{position:fixed; inset:0; z-index:2}

    /* Confetti Layer */
    #confetti{position:fixed; inset:0; pointer-events:none; z-index:5}

    /* Center stage */
    .stage{position:relative; z-index:6; height:100%; display:grid; place-items:center; text-align:center; padding:2rem}

    .card{backdrop-filter: blur(10px) saturate(140%); background:var(--glass); border:1px solid rgba(255,255,255,.25);
      border-radius:24px; box-shadow:0 20px 60px rgba(0,0,0,.35); padding:2rem 2rem 1.5rem; max-width:1000px;}

    .title{font-family:"Great Vibes", cursive; font-size: clamp(48px, 8vw, 120px); line-height:1; margin:.25rem 0 .75rem; text-shadow:0 4px 30px rgba(0,0,0,.4)}
    .rainbow{background: linear-gradient(90deg,#ff3cac 0%, #784ba0 25%, #2b86c5 50%, #00f5d4 75%, #f9f871 100%); -webkit-background-clip:text; background-clip:text; color:transparent; animation: rainbowShift 6s linear infinite}
    @keyframes rainbowShift{to{background-position: 200% 0}}

    .subtitle{font-weight:600; font-size:clamp(16px,2.2vw,28px); letter-spacing:.4px}
    .neon{ text-shadow: 0 0 10px var(--neon), 0 0 20px var(--neon), 0 0 40px var(--neon2) }

    .type{display:inline-block; border-right: 3px solid rgba(255,255,255,.75); white-space:nowrap; overflow:hidden}

    /* Buttons */
    .actions{display:flex; flex-wrap:wrap; gap:.75rem; justify-content:center; margin-top:1.25rem}
    .btn{--shadow: 0 10px 30px rgba(0,0,0,.25); position:relative; border:none; border-radius:999px; padding:.9rem 1.2rem; font-weight:700; cursor:pointer; color:#111; background:conic-gradient(from 0deg, #fff, #ffe7ff, #e7fff9, #fffcd9, #fff);
      box-shadow: var(--shadow); transition: transform .15s ease, filter .2s ease}
    .btn:hover{transform: translateY(-2px)}
    .btn:active{transform: translateY(0)}
    .btn .emoji{filter: drop-shadow(0 4px 10px rgba(0,0,0,.35))}

    /* Balloons */
    .balloon{position:fixed; bottom:-20vh; width:80px; height:100px; border-radius:50% 50% 50% 50%; z-index:3; opacity:.95; box-shadow: inset -8px -16px 40px rgba(0,0,0,.2);
      animation: rise var(--t,12s) linear forwards;}
    .balloon:after{content:""; position:absolute; bottom:-16px; left:50%; width:2px; height:50px; background:rgba(255,255,255,.7)}
    @keyframes rise{to{transform: translateY(-120vh) translateX(var(--x, 0)); opacity:.85}}

    /* Floating decorations */
    .stars{position:fixed; inset:0; background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 3px 3px; opacity:.08; z-index:0;}

    /* Footer note */
    .foot{margin-top:1rem; opacity:.9; font-size:14px}
    .foot a{color:#fff}

    /* Reduce motion toggle */
    .switch{display:inline-flex; align-items:center; gap:.5rem; margin-top:.75rem; font-size:14px; opacity:.9}
    .switch input{appearance:none; width:42px; height:24px; background:#fff; border-radius:999px; position:relative; outline:none; cursor:pointer}
    .switch input:before{content:""; position:absolute; width:18px; height:18px; border-radius:50%; background:linear-gradient(#fff,#eee); top:3px; left:3px; transition: left .2s ease}
    .switch input:checked{background:#111}
    .switch input:checked:before{left:21px}
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <canvas id="fw"></canvas>
  <div id="confetti"></div>
  <div class="bubbles" id="bubbles"></div>

  <main class="stage" role="main" aria-live="polite">
    <section class="card" aria-label="Lời chúc">
      <div class="subtitle neon">🎉 Chúc mừng sinh nhật 🎉</div>
      <h1 class="title rainbow">Trọng Renny</h1>
      <p class="subtitle type" id="typeLine" aria-label="Lời chúc chạy chữ"></p>

      <div class="actions">
        <button class="btn" id="btnFire"><span class="emoji">🎆</span> Bắn pháo hoa</button>
        <button class="btn" id="btnConfetti"><span class="emoji">🎊</span> Thả confetti</button>
        <button class="btn" id="btnBalloon"><span class="emoji">🎈</span> Thả bóng bay</button>
        <button class="btn" id="btnParty"><span class="emoji">✨</span> Party Auto</button>
        <button class="btn" id="btnMusic"><span class="emoji">🎵</span> Bật/Tắt nhạc</button>
      </div>

      <label class="switch" title="Giảm hiệu ứng nếu máy yếu">
        <input type="checkbox" id="reduceMotion">
        <span>Giảm hiệu ứng</span>
      </label>

      <div class="foot">Made with 💖 cho <strong>Trọng Renny</strong> — Hãy luôn rực rỡ như pháo hoa! | <a href="#" id="dlShot">Tải ảnh kỉ niệm</a></div>
    </section>
  </main>

  <audio id="music" preload="auto" loop autoplay muted playsinline>
    <!-- Đặt file nhạc cùng thư mục và đổi tên ở đây -->
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <script>
    // ===== Helpers =====
    const rand = (min, max) => Math.random()*(max-min)+min;
    const pick = arr => arr[Math.floor(Math.random()*arr.length)];
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

    // ===== Typewriter =====
    const lines = [
      "Tuổi mới rực rỡ như cầu vồng!",
      "Mọi ước mơ đều cất cánh 🎈",
      "Luôn khoẻ, luôn vui và luôn chất!",
      "Tiền vào như nước, hạnh phúc như mây ☁️",
      "Happy Birthday, Trọng Renny! 💖"
    ];
    const typeEl = document.getElementById('typeLine');
    let li=0, ci=0, erase=false;
    function typeLoop(){
      const speed = 40;
      if(!erase){
        typeEl.textContent = lines[li].slice(0, ++ci);
        if(ci===lines[li].length){ erase=true; setTimeout(typeLoop, 1100); return; }
      } else {
        typeEl.textContent = lines[li].slice(0, --ci);
        if(ci===0){ erase=false; li=(li+1)%lines.length; }
      }
      setTimeout(typeLoop, speed);
    }
    typeLoop();

    // ===== Bubbles background =====
    const bubbles = document.getElementById('bubbles');
    function spawnBubble(){
      const b = document.createElement('div');
      b.className='bubble';
      b.style.left = rand(0, 100) + 'vw';
      const d = rand(8, 20);
      b.style.width = d+'px'; b.style.height=d+'px';
      b.style.animationDuration = rand(10, 26)+'s';
      bubbles.appendChild(b);
      setTimeout(()=>b.remove(), 28000);
    }
    for(let i=0;i<40;i++) setTimeout(spawnBubble, i*300);
    setInterval(()=>{ if(!reduceMotion.checked) spawnBubble(); }, 800);

    // ===== Fireworks =====
    const canvas = document.getElementById('fw');
    const ctx = canvas.getContext('2d');
    let W=canvas.width=innerWidth, H=canvas.height=innerHeight;
    addEventListener('resize',()=>{W=canvas.width=innerWidth; H=canvas.height=innerHeight;});

    const sparks=[];
    function Firework(x,y,hue){
      const count = 140;
      for(let i=0;i<count;i++){
        const a = Math.random()*Math.PI*2;
        const s = rand(1.5, 6.5);
        sparks.push({
          x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 1, decay: rand(.007,.02),
          hue: hue + rand(-25,25)
        });
      }
    }
    function loop(){
      ctx.globalCompositeOperation='destination-out';
      ctx.fillStyle='rgba(0,0,0,.25)';
      ctx.fillRect(0,0,W,H);
      ctx.globalCompositeOperation='lighter';
      for(let i=sparks.length-1;i>=0;i--){
        const p=sparks[i];
        p.vy += 0.015; // gravity
        p.x += p.vx; p.y += p.vy; p.life -= p.decay;
        if(p.life<=0 || p.x<0||p.x>W||p.y<0||p.y>H){sparks.splice(i,1); continue;}
        ctx.beginPath();
        ctx.fillStyle = `hsla(${p.hue}, 100%, 60%, ${p.life})`;
        ctx.arc(p.x,p.y,2,0,Math.PI*2);
        ctx.fill();
      }
      requestAnimationFrame(loop);
    }
    loop();

    function burstRandom(times=3){
      for(let i=0;i<times;i++){
        setTimeout(()=>Firework(rand(0,W), rand(H*0.15, H*0.75), rand(0,360)), i*200);
      }
    }

    // ===== Confetti =====
    const conf = document.getElementById('confetti');
    const confColors = ['#ff3cac','#784ba0','#2b86c5','#00f5d4','#f9f871','#ff6ec7','#ffd166'];
    function confetti(n=120){
      for(let i=0;i<n;i++){
        const s = document.createElement('div');
        const size = rand(6,14);
        s.style.cssText = `position:absolute;top:-10px;left:${rand(0,100)}vw;width:${size}px;height:${size*0.6}px;background:${pick(confColors)};transform:rotate(${rand(0,360)}deg);opacity:.95;`;
        s.style.borderRadius = Math.random()>.5? '3px' : '50%';
        s.animate([
          { transform:`translate3d(0,0,0) rotate(0deg)` },
          { transform:`translate3d(${rand(-40,40)}vw, 105vh, 720deg)` }
        ],{ duration: rand(2000, 4200), easing:'cubic-bezier(.2,.8,.2,1)', fill:'forwards' });
        conf.appendChild(s); setTimeout(()=>s.remove(), 4500);
      }
    }

    // ===== Balloons =====
    function balloon(){
      const b = document.createElement('div');
      b.className='balloon';
      const hue = rand(0,360);
      b.style.left = rand(0, 100)+'vw';
      b.style.background = `radial-gradient(circle at 40% 30%, hsla(${hue},100%,85%,1), hsla(${hue},100%,55%,1))`;
      b.style.setProperty('--t', rand(10, 18)+'s');
      b.style.setProperty('--x', rand(-40, 40)+'px');
      document.body.appendChild(b);
      setTimeout(()=>b.remove(), 20000);
    }

    // ===== Music =====
    const music = document.getElementById('music');
    let musicOn=false; const desiredVolume = 0.8;

    function fadeTo(target=1, ms=1200){
      const start = music.volume; const diff = target-start; const t0 = performance.now();
      function step(t){
        const k = Math.min(1, (t - t0)/ms);
        music.volume = clamp(start + diff*k, 0, 1);
        if(k<1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    function toggleMusic(){
      if(!musicOn){
        music.play().then(()=>{ musicOn=true; music.muted=false; fadeTo(desiredVolume, 900); }).catch(()=>{});
      } else { music.pause(); music.currentTime=0; musicOn=false; }
    }

    // ===== Reduce Motion =====
    const reduceMotion = document.getElementById('reduceMotion');

    // ===== Party Auto =====
    let partyTimer=null;
    function party(){
      if(partyTimer){ clearInterval(partyTimer); partyTimer=null; return; }
      burstRandom(4); confetti(160); for(let i=0;i<8;i++) setTimeout(balloon, i*300);
      partyTimer = setInterval(()=>{
        if(reduceMotion.checked) return;
        burstRandom(3); confetti(90); if(Math.random()>.5) balloon();
      }, 1500);
      if(!musicOn) toggleMusic();
    }

    // ===== Screenshot (download) =====
    async function downloadShot(){
      // quick html2canvas-less approach: export fireworks layer only + transparent overlay text
      const shot = document.createElement('canvas'); shot.width=W; shot.height=H; const c=shot.getContext('2d');
      // background gradient approximation
      const g = c.createLinearGradient(0,0,W,H);
      g.addColorStop(0,'#12081f'); g.addColorStop(1,'#1b0c2d');
      c.fillStyle=g; c.fillRect(0,0,W,H);
      c.drawImage(canvas,0,0);
      // Title text
      c.font = `${Math.min(96, W*0.08)}px \"Great Vibes\"`; c.fillStyle='#fff'; c.textAlign='center';
      c.shadowColor='rgba(255,255,255,.6)'; c.shadowBlur=16;
      c.fillText('Happy Birthday • Trọng Renny', W/2, H*0.2);
      const a=document.createElement('a'); a.download='happy-birthday-trong-renny.png'; a.href=shot.toDataURL('image/png'); a.click();
    }

    // ===== Events =====
    document.getElementById('btnFire').addEventListener('click',()=>burstRandom(5));
    document.getElementById('btnConfetti').addEventListener('click',()=>confetti(150));
    document.getElementById('btnBalloon').addEventListener('click',balloon);
    document.getElementById('btnParty').addEventListener('click',party);
    document.getElementById('btnMusic').addEventListener('click',toggleMusic);
    document.getElementById('dlShot').addEventListener('click', (e)=>{e.preventDefault(); downloadShot();});

    // Auto intro (auto effects + auto music)
    window.addEventListener('load', ()=>{
      // Khởi động hiệu ứng auto
      party();

      // Cố gắng autoplay theo chính sách trình duyệt
      // 1) Phát ở trạng thái muted để vượt chặn, sau đó unmute + fade-in
      music.volume = 0; music.muted = true;
      music.play().then(()=>{
        musicOn = true;
        setTimeout(()=>{ try { music.muted = false; fadeTo(desiredVolume, 1500); } catch(e){} }, 1000);
      }).catch(()=>{});

      // 2) Nếu vẫn bị chặn, bật khi có tương tác đầu tiên
      const unlock = ()=>{
        music.muted = false; music.volume = 0.01;
        music.play().then(()=>{ musicOn = true; fadeTo(desiredVolume, 900); removeUnlock(); }).catch(()=>{});
      };
      const removeUnlock = ()=>{
        window.removeEventListener('pointerdown', unlock);
        window.removeEventListener('keydown', unlock);
        window.removeEventListener('touchstart', unlock);
      };
      window.addEventListener('pointerdown', unlock);
      window.addEventListener('keydown', unlock);
      window.addEventListener('touchstart', unlock);
    });

    // Firework on click anywhere
    addEventListener('pointerdown', e => {
      if(reduceMotion.checked) return;
      const rect = canvas.getBoundingClientRect();
      Firework(e.clientX-rect.left, e.clientY-rect.top, rand(0,360));
    });
  </script>
</body>
</html>
